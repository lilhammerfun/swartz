<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1320" viewBox="0 0 1520 1320">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker><marker id="waitArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7791f"/></marker></defs>
<rect width="1520" height="1320" fill="#fff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#172033">
<text x="60" y="48" font-size="28" font-weight="700">Tukdam 学习流程 · 泳道视图</text>
<text x="60" y="82" font-size="17" fill="#64748b">从上向下阅读：蓝色为学习主线，橙色为用户决策及等待；等待期间聊天继续。</text>
<rect x="60" y="110" width="320" height="1120" rx="12" fill="#f8fafc" stroke="#dce4ed"/>
<text x="220" y="147" text-anchor="middle" font-size="22" font-weight="700">用户</text>
<rect x="420" y="110" width="320" height="1120" rx="12" fill="#f0f6ff" stroke="#dce4ed"/>
<text x="580" y="147" text-anchor="middle" font-size="22" font-weight="700">聊天 Agent</text>
<rect x="780" y="110" width="320" height="1120" rx="12" fill="#f4f8fb" stroke="#dce4ed"/>
<text x="940" y="147" text-anchor="middle" font-size="22" font-weight="700">学习追踪</text>
<rect x="1140" y="110" width="320" height="1120" rx="12" fill="#f4faf7" stroke="#dce4ed"/>
<text x="1300" y="147" text-anchor="middle" font-size="22" font-weight="700">书籍整理</text>
<path d="M358,235 H454" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M600,289 V411" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="663" y="345" font-size="16" fill="#64748b" text-anchor="middle">归属明确</text>
<path d="M454,235 H404 V345 H358" fill="none" stroke="#b7791f" stroke-width="2.3" marker-end="url(#waitArrow)" stroke-dasharray="7 5"/>
<text x="408" y="312" font-size="16" fill="#b7791f" text-anchor="middle">需用户决策</text>
<path d="M220,384 V691" fill="none" stroke="#b7791f" stroke-width="2.3" marker-end="url(#waitArrow)" stroke-dasharray="7 5"/>
<text x="220" y="570" font-size="16" fill="#b7791f" text-anchor="middle">稍后选择；未选则保持等待</text>
<path d="M358,345 H600 V411" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="524" y="329" font-size="16" fill="#64748b" text-anchor="middle">聊天继续</text>
<path d="M462,450 H358" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M738,450 H802" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M940,489 V546" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M940,654 V682 H1118 V842 H1030 V856" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1160" y="686" font-size="16" fill="#64748b" text-anchor="middle">已确认</text>
<path d="M802,600 H762 V790 H802" fill="none" stroke="#b7791f" stroke-width="2.3" marker-end="url(#waitArrow)" stroke-dasharray="7 5"/>
<text x="722" y="651" font-size="16" fill="#b7791f" text-anchor="middle">未确认</text>
<path d="M940,829 V856" fill="none" stroke="#b7791f" stroke-width="2.3" marker-end="url(#waitArrow)" stroke-dasharray="7 5"/>
<path d="M358,730 H940 V751" fill="none" stroke="#b7791f" stroke-width="2.3" marker-end="url(#waitArrow)" stroke-dasharray="7 5"/>
<text x="560" y="715" font-size="16" fill="#b7791f" text-anchor="middle">确认归属，释放暂存内容</text>
<path d="M1078,895 H1162" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>

<path d="M802,895 H738" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M1300,934 V1035 H358" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M220,1074 V1121" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M358,1160 H462" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="82.0" y="196.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="220" y="228" text-anchor="middle" font-size="18">开始 · 1. 提问／引用追问</text>
<text x="220" y="256" text-anchor="middle" font-size="18">系统保存用户输入</text>
<path d="M600,181 L746,235 L600,289 L454,235 Z" fill="#fff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="600" y="230" font-size="18" text-anchor="middle">2. 主题归属</text>
<text x="600" y="257" font-size="18" text-anchor="middle">是否明确？</text>
<rect x="82.0" y="306.0" width="276" height="78" rx="11" fill="#fff7e8" stroke="#d9a044" stroke-width="1.8"/>
<text x="220" y="338" text-anchor="middle" font-size="18">2a. 查看根主题候选</text>
<text x="220" y="366" text-anchor="middle" font-size="18">或范围／交叉归属方案</text>
<rect x="462.0" y="411.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="600" y="443" text-anchor="middle" font-size="18">3. 检索局部理解状态</text>
<text x="600" y="471" text-anchor="middle" font-size="18">生成教学回答</text>
<rect x="82.0" y="411.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="220" y="457" text-anchor="middle" font-size="18">接收回答，继续学习</text>
<rect x="802.0" y="411.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="940" y="443" text-anchor="middle" font-size="18">4. 保存回答</text>
<text x="940" y="471" text-anchor="middle" font-size="18">提取概念与理解证据</text>
<path d="M940,546 L1086,600 L940,654 L794,600 Z" fill="#fff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="940" y="595" font-size="18" text-anchor="middle">5. 当前内容依赖</text>
<text x="940" y="622" font-size="18" text-anchor="middle">是否已确定？</text>
<rect x="82.0" y="691.0" width="276" height="78" rx="11" fill="#fff7e8" stroke="#d9a044" stroke-width="1.8"/>
<text x="220" y="723" text-anchor="middle" font-size="18">2c. 选择候选</text>
<text x="220" y="751" text-anchor="middle" font-size="18">或表达自定义范围</text>
<rect x="802.0" y="751.0" width="276" height="78" rx="11" fill="#fff7e8" stroke="#d9a044" stroke-width="1.8"/>
<text x="940" y="783" text-anchor="middle" font-size="18">2b. 暂存并持久等待</text>
<text x="940" y="811" text-anchor="middle" font-size="18">2d. 确认后恢复处理</text>
<rect x="802.0" y="856.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="940" y="888" text-anchor="middle" font-size="18">6. 确认概念身份与来源</text>
<text x="940" y="916" text-anchor="middle" font-size="18">图、理解状态分别处理</text>
<rect x="462.0" y="856.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="600" y="888" text-anchor="middle" font-size="18">7b. 后续对话</text>
<text x="600" y="916" text-anchor="middle" font-size="18">使用最新状态</text>
<rect x="1162.0" y="856.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="1300" y="888" text-anchor="middle" font-size="18">7a. 增量组织书籍</text>
<text x="1300" y="916" text-anchor="middle" font-size="18">更新相关章节</text>
<rect x="82.0" y="996.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="220" y="1042" text-anchor="middle" font-size="18">8. 阅读书籍章节</text>
<rect x="82.0" y="1121.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="220" y="1167" text-anchor="middle" font-size="18">选中文字追问</text>
<rect x="462.0" y="1121.0" width="276" height="78" rx="11" fill="#ffffff" stroke="#8ba7c5" stroke-width="1.8"/>
<text x="600" y="1153" text-anchor="middle" font-size="18">返回步骤 1</text>
<text x="600" y="1181" text-anchor="middle" font-size="18">复用同一学习流程</text>
<text x="60" y="1266" font-size="17" fill="#64748b">决策确认只释放已暂存内容；尚未产生的内容仍在回答完成后处理。无关主题的学习不受等待影响。</text>
<text x="60" y="1296" font-size="17" fill="#64748b">追踪与成书独立执行，评分失败不阻塞章节整理；失败保留原对话，只重试未完成部分。</text></g></svg>